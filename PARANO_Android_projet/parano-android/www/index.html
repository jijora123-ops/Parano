function rulesBrief(){return `<div class="rules"><div class="rule"><div class="emoji">🤫</div><b>Une question</b><span>Un seul joueur la voit</span></div><div class="rule"><div class="emoji">👉</div><b>Un prénom</b><span>On désigne quelqu'un</span></div><div class="rule"><div class="emoji">👀</div><b>Le choix</b><span>Secret ou révélation</span></div></div>`}
function draw(){switch(st.page){
case 'home':render(`<section class="hero"><span class="eyebrow">🔥 À jouer sur un seul téléphone</span><h1>LES SECRETS<br><span class="gradient">VONT SORTIR.</span></h1><p class="sub">Un joueur reçoit une question que personne ne connaît. Il désigne quelqu'un. Et là… tout le monde se demande <b>pourquoi ?</b></p><div class="face-box"><span class="face">👀</span></div></section><div class="card"><span class="pill">🃏 400 questions originales</span>${rulesBrief()}<div class="button-stack"><button class="btn" onclick="goto('setup')">Lancer la soirée →</button><button class="btn2" id="installBtn" onclick="installParano()">📲 Installer sur mon téléphone</button></div><div id="installHelp" class="soft-card muted" hidden></div></div><p class="muted center" style="margin-top:11px">Sans compte · Sans pub · Hors ligne après la première ouverture en ligne · 3 joueurs minimum</p>`);break;
case 'setup':setup();break;
case 'pass':pass();break;
case 'private':privateView();break;
case 'target':targetView();break;
case 'announce':announce();break;
case 'decision':decision();break;
case 'peek':peek();break;
case 'finish':finish();break;
case 'stats':stats();break;
case 'menu':menu();break;
case 'revealText':showRevealText();break;
}}
function setup(){render(`<div class="setup-head"><div><span class="eyebrow">ÉTAPE 01 · PRÉPARATION</span><h2>Qui est<br>dans la partie ?</h2></div><span style="font-size:48px">🥳</span></div><div class="card"><h3>Les joueurs <span class="muted">(${st.names.length})</span></h3><div class="player-field"><input id="newName" maxlength="24" autocomplete="off" placeholder="Ajouter un prénom" aria-label="Prénom"><button class="add" onclick="addPlayer()" aria-label="Ajouter un joueur">+</button></div><div class="roster">${st.names.map((x,i)=>`<button class="player-chip" onclick="removePlayer(${i})">${esc(x)} <span class="x">×</span></button>`).join('')||'<span class="muted">Ajoute au moins 3 personnes pour commencer.</span>'}</div><div class="fieldtitle">🌶️ Choisis tes catégories</div><p class="muted">Coche uniquement les catégories que tu veux mélanger.</p><div class="option-grid" style="margin-top:10px">${CATEGORIES.map(([v,t,d])=>`<button type="button" class="choice category ${st.levels.includes(v)?'active':''}" aria-pressed="${st.levels.includes(v)}" onclick="toggleLevel(${v})"><strong><span class="checkmark">${st.levels.includes(v)?'✓':'○'}</span> ${t}</strong><small>100 questions · ${d}</small></button>`).join('')}</div><div class="category-tools"><button class="tiny" onclick="selectLevels(true)">Tout sélectionner</button><button class="tiny" onclick="selectLevels(false)">Tout décocher</button></div><div class="soft-card selection-total"><b>${poolSize()} questions sélectionnées</b><p class="muted">${st.levels.length?st.levels.length+' catégorie(s) · Tirage aléatoire mélangé':'Choisis au moins une catégorie.'}</p></div>${needsAdults()?`<label class="adult-check"><input type="checkbox" ${st.adultOK?'checked':''} onchange="confirmAdults(this.checked)"><span>Tous les joueurs ont 18 ans ou plus et acceptent les questions adultes. Chacun peut passer sans justification.</span></label>`:''}<div class="fieldtitle">🎲 Pour connaître la question</div><div class="option-grid"><button class="choice ${st.mode==='gage'?'active':''}" onclick="setMode('gage')"><strong>🎭 Mode gage</strong><small>Sans alcool, avec défis</small></button><button class="choice ${st.mode==='drink'?'active':''}" onclick="setMode('drink')"><strong>🥤 Mode gorgée</strong><small>Boisson au choix</small></button></div><div class="button-stack"><button class="btn" onclick="start()" ${canStart()?'':'disabled'}>Commencer avec ${st.names.length} joueurs →</button></div><div class="muted center">Personne n'est obligé de répondre ou de boire. Tout le monde peut passer son tour.</div></div>`);const inp=$('newName'); if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer()})}
function addPlayer(){const inp=$('newName');const n=(inp?.value||'').trim().replace(/\s+/g,' ');if(!n)return;if(st.names.some(x=>x.toLocaleLowerCase()===n.toLocaleLowerCase())){alert('Prénom déjà ajouté. Mets un surnom pour les distinguer.');return}if(st.names.length>=20){alert('Maximum 20 joueurs.');return}st.names.push(n);save();setup();$('newName')?.focus()}
function removePlayer(i){st.names.splice(i,1);save();setup()}
function needsAdults(){return st.levels.some(n=>n>=3)}
function poolSize(){return st.levels.reduce((sum,n)=>sum+QUESTIONS[n].length,0)}
function canStart(){return st.names.length>=3&&st.levels.length>0&&(!needsAdults()||st.adultOK)}
function toggleLevel(n){if(!CATEGORIES.some(([v])=>v===n))return;st.levels=st.levels.includes(n)?st.levels.filter(v=>v!==n):[...st.levels,n].sort((a,b)=>a-b);st.adultOK=false;save();setup()}
function selectLevels(all){st.levels=all?[1,2,3,4]:[];st.adultOK=false;save();setup()}
function confirmAdults(checked){st.adultOK=checked;setup()}
function makeDeck(){return shuffle(st.levels.flatMap(n=>QUESTIONS[n]))}
function setMode(n){st.mode=n;save();setup()}
function start(){if(!canStart())return;st.round=0;st.reader=null;st.target=null;st.question='';st.history=[];st.used=new Set();st.counts=Object.fromEntries(st.names.map(n=>[n,0]));st.revealCount=0;st.secretCount=0;st.deck=makeDeck();nextRound()}
function chooseQuestion(){if(st.deck.length===0)st.deck=makeDeck();return st.deck.pop()}
function nextRound(){const last=st.reader;st.reader=pick(st.names.filter(n=>n!==last));st.target=null;st.question=chooseQuestion();st.round+=1;goto('pass')}
function progress(){return `<div class="toprow"><span class="counter">MANCHE ${st.round}</span><span class="pill">${st.levels.length===1?CATEGORIES.find(([v])=>v===st.levels[0])[1].toUpperCase():'🎲 MIX · '+st.levels.length+' CATÉGORIES'}</span></div><div class="roundline"><div style="width:${({pass:20,private:39,target:55,announce:70,decision:83,peek:92,finish:100}[st.page]||10)}%"></div></div>`}
function pass(){render(`${progress()}<div class="center" style="margin-top:14px"><span class="eyebrow">🤫 PASSAGE DU TÉLÉPHONE</span><h2>Au tour de<br><span style="color:#efa5f5">${esc(st.reader)} !</span></h2><div class="glass"><div class="avatar">🕵️</div><p class="word">Tu vas découvrir<br>une question secrète.</p><p class="notice">Personne d'autre ne doit voir l'écran. Lis la question dans ta tête, puis choisis un joueur.</p></div><button class="btn" onclick="goto('private')">Je suis ${esc(st.reader)} · Voir la question 👁️</button><button class="ghost" onclick="skipQuestion()">Changer de question</button></div>`)}
function privateView(){render(`${progress()}<span class="eyebrow">🔒 POUR LES YEUX DE ${esc(st.reader).toUpperCase()}</span><div class="paper"><span class="kbd">QUESTION SECRÈTE</span><div class="secret">${esc(st.question)}</div><span class="kbd">NE LA LIS PAS À VOIX HAUTE</span></div><div class="h-notice">Choisis une personne correspondant le mieux à la question. Tu vas annoncer son prénom à voix haute, mais surtout <b>pas la question</b>.</div><button class="btn" onclick="goto('target')">J'ai choisi dans ma tête →</button><button class="btn2" style="margin-top:10px" onclick="skipQuestion()">🔀 Une autre question</button>`)}
function skipQuestion(){st.question=chooseQuestion();goto('pass')}
function targetView(){render(`${progress()}<span class="eyebrow">👉 DÉSIGNE LA PERSONNE</span><h2>Qui vas-tu<br><span style="color:#ff9dca">pointer du doigt ?</span></h2><p class="sub">${esc(st.reader)}, sélectionne son prénom. Attention : les autres ne doivent toujours pas connaître la question.</p><div class="target-grid">${st.names.map((n,i)=>n===st.reader?'':`<button class="target" onclick="selectTarget(st.names[${i}])">👀 ${esc(n)}</button>`).join('')}</div><div class="space"></div><button class="btn2" onclick="goto('private')">← Revoir la question</button>`)}
function selectTarget(n){st.target=n;st.counts[n]=(st.counts[n]||0)+1;goto('announce')}
function announce(){render(`${progress()}<div class="glass" style="margin-top:10px"><div class="heart">👉</div><div class="question-label">${esc(st.reader)} A DÉSIGNÉ…</div><div class="name" style="margin:18px 0;color:#ffabdf">${esc(st.target)} !</div><p class="word" style="font-size:25px">Mais pour quelle raison ?</p><div class="more"><span class="mini-person">🤔 C'est gentil ?</span><span class="mini-person">🔥 C'est gênant ?</span><span class="mini-person">👀 Un secret ?</span></div></div><div class="center"><p class="notice">${esc(st.reader)}, garde un visage impassible ! Personne ne doit révéler la question.</p></div><button class="btn" onclick="goto('decision')">${esc(st.target)} décide →</button><button class="btn2" style="margin-top:10px" onclick="reselect()">Modifier la personne désignée</button>`)}
function reselect(){st.counts[st.target]=Math.max(0,st.counts[st.target]-1);st.target=null;goto('target')}
function cost(){return st.mode==='drink'?'une gorgée de la boisson de ton choix':'un gage au choix du groupe'}
function allCost(){return st.mode==='drink'?'Le groupe prend une gorgée au choix.':'Le groupe relève un mini-défi collectif.'}
function decision(){render(`${progress()}<div class="center" style="margin-top:14px"><span class="eyebrow">👀 LE DILEMME</span><h2>${esc(st.target)},<br><span style="color:#fda1d2">tu veux savoir ?</span></h2><p class="sub">Tu peux connaître la question que ${esc(st.reader)} a lue… mais le prix de ta curiosité est <b>${esc(cost())}</b>.</p><div class="glass"><div class="avatar">🤯</div><div class="word">« Pourquoi moi ?! »</div><p class="notice">Tu peux aussi refuser : la question restera secrète.</p></div></div><div class="button-stack"><button class="btn" onclick="reveal()">😈 Oui, je veux savoir !</button><button class="btn2" onclick="keepSecret()">🤐 Non, je préfère ne pas savoir</button><button class="btn2" onclick="passTurn()">🕊️ Passer sans gage</button></div>`)}
function reveal(){st.revealCount+=1;st.history.push({round:st.round,reader:st.reader,target:st.target,revealed:true});goto('peek')}
function keepSecret(){st.secretCount+=1;st.history.push({round:st.round,reader:st.reader,target:st.target,revealed:false});goto('finish')}
function passTurn(){st.history.push({round:st.round,reader:st.reader,target:st.target,revealed:null});goto('finish')}
function peek(){render(`${progress()}<div class="center"><span class="eyebrow">🔒 NE REGARDE PAS L'ÉCRAN</span><h2>Seul(e) ${esc(st.target)}<br>doit lire ceci.</h2><p class="sub">Passe le téléphone à ${esc(st.target)}. Les autres : détournez les yeux !</p></div><div class="glass"><div class="avatar">🤫</div><p class="word">La vérité t'attend.</p><p class="notice">Quand tu es seul(e) à regarder, appuie sur le bouton.</p></div><button class="btn" onclick="goto('revealText')">Je suis ${esc(st.target)} · Révéler 👁️</button>`)}
function showRevealText(){st.page='revealText';render(`<span class="eyebrow">😈 LA VÉRITÉ · POUR ${esc(st.target).toUpperCase()}</span><div class="paper"><span class="kbd">LA QUESTION DE ${esc(st.reader).toUpperCase()}</span><div class="secret">${esc(st.question)}</div></div><div class="center" style="margin-top:12px"><h3>Tu comprends mieux maintenant ? 👀</h3><p class="notice">Tu peux garder la question pour toi ou en parler au groupe si tout le monde est d'accord.</p></div><div class="banner">${esc(allCost())} Chacun peut remplacer le défi par une option sans alcool ou passer.</div><div class="space"></div><button class="btn" onclick="goto('finish')">Terminer cette manche →</button>`)}
function finish(){const last=st.history[st.history.length-1];let msg=last?.revealed===true?'La curiosité a gagné. 👀':last?.revealed===false?'Le secret reste bien gardé. 🤐':'Un tour passé, sans pression. 🕊️';render(`${progress()}<div class="center" style="margin-top:45px"><div style="font-size:71px;margin-bottom:15px">${last?.revealed===true?'🔥':last?.revealed===false?'🤫':'💜'}</div><h2>${msg}</h2><p class="sub">${esc(st.reader)} a choisi ${esc(st.target)}. ${last?.revealed===true?'Une révélation qui va faire parler…':'Le groupe peut maintenant imaginer toutes les raisons.'}</p><div class="dash"><div><b>${st.round}</b><span>Manches</span></div><div><b>${st.revealCount}</b><span>Révélations</span></div><div><b>${st.secretCount}</b><span>Secrets</span></div></div></div><div class="button-stack"><button class="btn" onclick="nextRound()">Manche suivante →</button><button class="btn2" onclick="goto('stats')">📊 Voir les statistiques</button></div>`)}
function stats(){let sorted=Object.entries(st.counts).sort((a,b)=>b[1]-a[1]);let mx=Math.max(1,...Object.values(st.counts));render(`<span class="eyebrow">📊 APRÈS ${st.round} MANCHES</span><h2>Les plus<br><span style="color:#eda0e4">suspects 👀</span></h2><p class="sub">Combien de fois chaque personne a été désignée ?</p><div class="card">${sorted.map(([n,c],i)=>`<div class="score-row"><div class="rank">${i+1}</div><div style="flex:1"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(n)}</b><span style="color:#e7c8f9">${c} fois</span></div><div class="scorebar"><div style="width:${Math.round(c/mx*100)}%"></div></div></div></div>`).join('')}</div><div class="dash"><div><b>${st.round}</b><span>Manches</span></div><div><b>${st.revealCount}</b><span>Révélations</span></div><div><b>${st.secretCount}</b><span>Secrets</span></div></div><div class="button-stack"><button class="btn" onclick="nextRound()">Reprendre le jeu →</button><button class="btn2" onclick="goto('menu')">Menu</button></div>`)}
function menu(){render(`<span class="eyebrow">⚙️ OPTIONS</span><h2>La soirée<br>continue ?</h2><div class="card"><h3>Partie en cours</h3><p class="muted" style="margin-top:6px">${st.round} manche(s) · ${st.names.length} joueur(s)</p><div class="button-stack">${st.round?'<button class="btn" onclick="resume()">↩ Revenir au jeu</button>':''}<button class="btn2" onclick="goto('stats')">📊 Statistiques</button><button class="btn2" onclick="resetSetup()">👥 Nouvelle partie / joueurs</button><button class="btn2" onclick="goto('home')">🏠 Accueil</button></div></div><div class="soft-card"><h3>Les règles</h3><p class="muted" style="margin-top:10px">Une personne découvre secrètement la question, choisit quelqu'un et annonce son prénom. La personne désignée accepte ou non le gage pour lire la question à l'abri des regards. Dans cette version, quand la question est révélée, le groupe relève aussi un mini-défi collectif (ou prend une gorgée si ce mode a été choisi). On peut toujours passer sans justification.</p></div>`)}
function resume(){goto(st.resumePage||'pass')}
function resetSetup(){if(st.round&&!confirm('Créer une nouvelle partie ? Les statistiques de la partie en cours seront effacées.'))return;st.round=0;st.deck=[];st.adultOK=false;st.history=[];st.counts={};st.revealCount=0;st.secretCount=0;goto('setup')}
function openMenu(){if(st.page!=='menu')st.resumePage=st.page;goto('menu')}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.page==='revealText')goto('finish')});

let pendingInstall=null;
function isInstalled(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function updateInstallButton(){const b=$('installBtn');if(b)b.hidden=isInstalled()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pendingInstall=e;updateInstallButton()});
window.addEventListener('appinstalled',()=>{pendingInstall=null;updateInstallButton();const h=$('installHelp');if(h)h.hidden=true});
async function installParano(){
  if(isInstalled())return;
  if(pendingInstall){const prompt=pendingInstall;pendingInstall=null;try{await prompt.prompt();const result=await prompt.userChoice;if(result.outcome==='accepted')return}catch(e){/* manual instructions below */}}
  const h=$('installHelp');if(!h)return;
  const ios=/iPad|iPhone|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(location.protocol==='file:')h.textContent="Pour installer PARANO, ouvre d’abord sa version hébergée via une adresse HTTPS.";
  else if(ios)h.textContent="Sur iPhone : ouvre cette page dans Safari, touche Partager, puis Sur l’écran d’accueil et Ajouter. Active Ouvrir comme app web si proposé.";
  else h.textContent="Dans Chrome sur Android : touche ⋮, puis Installer l’application ou Ajouter à l’écran d’accueil. Si l’option n’apparaît pas, recharge la page en HTTPS après la première ouverture.";
  h.hidden=false;
}
if('serviceWorker' in navigator && !window.Capacitor && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('PARANO: cache hors connexion indisponible',e)));
}

draw();
</script>
</body>
</html>
