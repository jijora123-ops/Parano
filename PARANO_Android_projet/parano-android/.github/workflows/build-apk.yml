name: Build APK PARANO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PARANO_Android_projet/parano-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer les icônes
        run: npx --yes @capacitor/assets generate --android --assetPath assets

      - name: Copier le site dans l'app
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: PARANO_Android_projet/parano-android/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PARANO-apk
          path: PARANO_Android_projet/parano-android/android/app/build/outputs/apk/debug/app-debug.apk
